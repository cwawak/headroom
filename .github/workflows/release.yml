name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-version-tag:
    name: Create Version Tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid app version: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null; then
              echo "$TAG and its release already exist; nothing to do"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "$TAG exists without a release; publishing it"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and Package Release
    needs: create-version-tag
    if: >-
      always() &&
      (github.event_name != 'push' ||
       startsWith(github.ref, 'refs/tags/v') ||
       needs.create-version-tag.outputs.publish == 'true')
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-version-tag.outputs.publish == 'true' && needs.create-version-tag.outputs.tag || github.ref }}

      - name: Set up Swift environment
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Run tests
        run: swift test

      - name: Package Release
        run: ./scripts/package-release.sh

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && needs.create-version-tag.outputs.publish != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Headroom-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/Headroom.dmg
            build/Headroom.app.zip

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || needs.create-version-tag.outputs.publish == 'true'
        with:
          tag_name: ${{ needs.create-version-tag.outputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/Headroom.dmg
            build/Headroom.app.zip
